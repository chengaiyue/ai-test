[project]
name = "agent"
version = "0.1.0"
description = "Agent 应用：基于 LangChain + LangGraph 的向量数据库（文档切片 / 查重 / 相似度查询）"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5,<2",
    "langchain>=1.4,<2",
    "langchain-text-splitters>=1.1,<2",
    "langchain-chroma>=1.1,<2",
    "langchain-openai>=1.6,<2",
    "langgraph>=1.2,<2",
    "numpy>=2",
    "httpx>=0.27",
    "common-utils",
    "log-utils",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
