[project]
name = "api"
version = "0.1.0"
description = "FastAPI 业务应用"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "common-utils",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
